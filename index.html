<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>抽獎小程式</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎉 抽獎系統</h1>
        
        <div class="input-group">
            <label>獎項名稱：</label>
            <input type="text" id="prizeName" placeholder="例如：精美禮品">
        </div>

        <div class="input-group">
            <label>參與名單（每行一位）：</label>
            <textarea id="participants" rows="5" placeholder="張三&#10;李四&#10;王五"></textarea>
        </div>

        <button id="drawBtn">開始抽獎</button>

        <div id="resultArea" class="hidden">
            <h2>中獎者：</h2>
            <div id="winner"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
